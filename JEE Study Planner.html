html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Arial,Helvetica,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 16px;border-left:8px solid var(--amb);display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.ph{display:flex;gap:8px;align-items:center;margin-bottom:10px}
input{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:4px;padding:3px 4px;width:100%;min-width:0}

.pt{font-size:20px;font-weight:700}

.tm{font-weight:700;font-size:12px;text-align:center}
.cell{border-radius:6px;padding:3px;text-align:center;border-left:4px solid transparent;background:var(--rest)}
.cell input{text-align:center;font-weight:700}.cell .tg{font-size:9px;color:var(--mut);letter-spacing:.5px}
.m{background:var(--mt);border-left-color:var(--m)}.p{background:var(--pt);border-left-color:var(--p)}.c{background:var(--ct);border-left-color:var(--c)}
.dk.m{background:var(--m);color:#fff}.dk.p{background:var(--p);color:#fff}.dk.c{background:var(--c);color:#fff}.dk .tg{color:#ffffffcc}

.ct button{border:0;background:none;color:var(--mut);cursor:pointer;padding:2px 3px}
.bar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.t td,.t th{padding:3px 4px}.t tr:nth-child(even) td{background:var(--bg)}.t{min-width:900px}
.k{width:26px;height:18px;accent-color:var(--navy)}

select#add{border-style:dashed}
